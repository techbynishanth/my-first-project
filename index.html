<!DOCTYPE html>
<html>
<head>
  <title>My First App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 30px;
      background-color: #f0f0f0;
    }

    input, textarea {
      padding: 10px;
      margin: 5px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      width: 250px;
    }

    button {
      padding: 12px 25px;
      margin: 10px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover { background-color: #45a049; }

    #message { margin-top: 20px; font-size: 18px; color: green; }

    #ai-reply {
      margin: 20px auto;
      width: 50%;
      background: white;
      padding: 20px;
      border-radius: 10px;
      font-size: 16px;
      color: #333;
      text-align: left;
      display: none;
    }

    table {
      margin: 0 auto;
      border-collapse: collapse;
      width: 50%;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }

    th { background-color: #4CAF50; color: white; }

    hr { margin: 40px auto; width: 50%; }
  </style>
</head>
<body>

  <h1>🎉 My First App</h1>

  <!-- Save User Section -->
  <hr>
  <h2>👤 Save a User</h2>
  <input type="text" id="name" placeholder="Enter name" />
  <br>
  <input type="text" id="email" placeholder="Enter email" />
  <br>
  <button onclick="saveUser()">💾 Save User</button>
  <p id="message"></p>

  <!-- Show Users Section -->
  <hr>
  <h2>📋 All Users in Database</h2>
  <button onclick="getUsers()">Show All Users</button>
  <div id="users"></div>

  <!-- AI Chat Section -->
  <hr>
  <h2>🤖 Ask AI Anything</h2>
  <textarea id="ai-input" placeholder="Type your question here..." rows="3"></textarea>
  <br>
  <button onclick="askAI()">Ask AI 🚀</button>

  <div id="ai-reply"></div>

  <script>
    // Save user
    async function saveUser() {
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;

      const response = await fetch('http://localhost:5000/api/save-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email })
      });

      const data = await response.json();
      document.getElementById('message').innerText = data.message;
    }

    async function getUsers() {
      const response = await fetch('http://localhost:5000/api/get-users');
      const users = await response.json();

      let html = '<table><tr><th>ID</th><th>Name</th><th>Email</th></tr>';
      users.forEach(user => {
        html += `<tr><td>${user[0]}</td><td>${user[1]}</td><td>${user[2]}</td></tr>`;
      });
      html += '</table>';

      document.getElementById('users').innerHTML = html;
    }

    async function askAI() {
      const message = document.getElementById('ai-input').value;

      document.getElementById('ai-reply').style.display = 'block';
      document.getElementById('ai-reply').innerText = '⏳ AI is thinking...';

      const response = await fetch('http://localhost:5000/api/ask-ai', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });

      const data = await response.json();
      document.getElementById('ai-reply').innerText = '🤖 ' + data.reply;
    }
  </script>

  </body>
</html>
