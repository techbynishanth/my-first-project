<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My First App</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 450px;
    }

    h1 {
      text-align: center;
      color: white;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: rgba(255,255,255,0.8);
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
      background: #f0f0f0;
      border-radius: 10px;
      padding: 4px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      color: #888;
      transition: all 0.3s;
    }

    .tab.active {
      background: white;
      color: #667eea;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .form { display: none; }
    .form.active { display: block; }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      margin-bottom: 12px;
      outline: none;
      transition: border 0.3s;
    }

    input:focus { border-color: #667eea; }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: transform 0.2s;
      margin-top: 5px;
    }

    button:hover { transform: translateY(-2px); }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .message.success {
      background: #f0fff4;
      border: 1px solid #9ae6b4;
      color: #276749;
      display: block;
    }

    .message.error {
      background: #fff5f5;
      border: 1px solid #feb2b2;
      color: #c53030;
      display: block;
    }

    /* Dashboard */
    .dashboard { display: none; }

    .dashboard.active {
      display: block;
      max-width: 800px;
    }

    .dashboard-card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .welcome {
      color: #333;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .logout-btn {
      width: auto;
      padding: 8px 20px;
      font-size: 14px;
      background: #ff6b6b;
      margin-top: 0;
    }

    textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      margin-bottom: 12px;
      outline: none;
      resize: none;
      transition: border 0.3s;
    }

    textarea:focus { border-color: #667eea; }

    .ai-reply {
      margin-top: 15px;
      padding: 16px;
      background: linear-gradient(135deg, #f8f9ff, #f0f0ff);
      border-left: 4px solid #667eea;
      border-radius: 10px;
      color: #333;
      font-size: 15px;
      line-height: 1.6;
      display: none;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #667eea;
      border-radius: 50%;
      display: inline-block;
      animation: bounce 1s infinite;
      margin: 0 2px;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <!-- Login/Signup Section -->
  <div class="container" id="auth-section">
    <h1>🚀 My First App</h1>
    <p class="subtitle">Sign in to continue</p>

    <div class="card">
      <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">Login</div>
        <div class="tab" onclick="switchTab('signup')">Sign Up</div>
      </div>

      <!-- Login Form -->
      <div class="form active" id="login-form">
        <input type="email" id="login-email" placeholder="Email address" />
        <input type="password" id="login-password" placeholder="Password" />
        <button onclick="login()">Login →</button>
        <div class="message" id="login-message"></div>
      </div>

      <!-- Signup Form -->
      <div class="form" id="signup-form">
        <input type="text" id="signup-name" placeholder="Your name" />
        <input type="email" id="signup-email" placeholder="Email address" />
        <input type="password" id="signup-password" placeholder="Password" />
        <button onclick="signup()">Create Account →</button>
        <div class="message" id="signup-message"></div>
      </div>
    </div>
  </div>

  <!-- Dashboard Section -->
  <div class="container dashboard" id="dashboard-section">
    <div class="dashboard-card">
      <div class="dashboard-header">
        <span class="welcome" id="welcome-text">👋 Welcome!</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>

      <h3 style="margin-bottom:15px; color:#333;">🤖 Ask AI Anything</h3>
      <textarea id="ai-input" placeholder="Type your question here..." rows="3"></textarea>
      <button onclick="askAI()">Ask AI 🚀</button>
      <div class="ai-reply" id="ai-reply"></div>
    </div>
  </div>

  <script>
    let currentUser = null;

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));

      if (tab === 'login') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('login-form').classList.add('active');
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('signup-form').classList.add('active');
      }
    }

    function showMessage(id, text, type) {
      const msg = document.getElementById(id);
      msg.className = 'message ' + type;
      msg.innerText = text;
      setTimeout(() => { msg.className = 'message'; }, 3000);
    }

    async function signup() {
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;

      if (!name || !email || !password) {
        showMessage('signup-message', 'Please fill all fields!', 'error');
        return;
      }

      const response = await fetch('http://localhost:5000/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });

      const data = await response.json();

      if (data.error) {
        showMessage('signup-message', data.error, 'error');
      } else {
        showMessage('signup-message', '✅ ' + data.message, 'success');
        setTimeout(() => switchTab('login'), 1500);
      }
    }

    async function login() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        showMessage('login-message', 'Please fill all fields!', 'error');
        return;
      }

      const response = await fetch('http://localhost:5000/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (data.error) {
        showMessage('login-message', data.error, 'error');
      } else {
        currentUser = data.user;
        showDashboard();
      }
    }

    function showDashboard() {
      document.getElementById('auth-section').style.display = 'none';
      document.getElementById('dashboard-section').classList.add('active');
      document.getElementById('welcome-text').innerText = '👋 Welcome, ' + currentUser.name + '!';
    }

    function logout() {
      currentUser = null;
      document.getElementById('auth-section').style.display = 'flex';
      document.getElementById('dashboard-section').classList.remove('active');
    }

    async function askAI() {
      const message = document.getElementById('ai-input').value;
      if (!message) return;

      const reply = document.getElementById('ai-reply');
      reply.style.display = 'block';
      reply.innerHTML = '<div><div class="dot"></div><div class="dot"></div><div class="dot"></div> AI is thinking...</div>';

      const response = await fetch('http://localhost:5000/api/ask-ai', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });

      const data = await response.json();
      if (data.reply) {
        reply.innerText = '🤖 ' + data.reply;
      } else {
        reply.innerText = '❌ ' + data.error;
      }
    }
  </script>

</body>
</html>
